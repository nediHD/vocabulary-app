<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Persönliche Deutsch-Französisch Vokabel-App mit Spaced Repetition" />
    <meta name="theme-color" content="#2f6df0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vokabular – Nediljko</title>
    <script>
      // Nach einem Deploy zeigt eine im Browser-Cache liegende alte index.html
      // auf CSS/JS-Dateien, die es nicht mehr gibt (404). Dann einmal automatisch
      // die frische Version nachladen – statt kaputter, ungestylter Seite.
      (function () {
        var KEY = 'reloaded-for-stale-assets';
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (!t) return;
            var url = t.href || t.src || '';
            var isAsset =
              (t.tagName === 'LINK' || t.tagName === 'SCRIPT') &&
              /\/assets\/.*\.(css|js)(\?|$)/.test(url);
            if (isAsset && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, '1');
              location.reload();
            }
          },
          true // Capture-Phase: Ressourcen-Fehler steigen nicht auf
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
